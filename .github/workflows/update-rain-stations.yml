name: Update Rain Stations

on:
  schedule:
    # ทุก 3 ชั่วโมง offset 15 นาที (ไม่ชนกับ water-level ที่ :00)
    - cron: '15 */3 * * *'
  workflow_dispatch:

jobs:
  update-rain-stations:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch rain stations (ThaiWater API)
        run: python scripts/fetch_rain_stations.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/rain-stations.json
          message: "auto: update rain stations (ThaiWater)"
          date-format: ""
