name: Update Province Weather Data

on:
  schedule:
    # 1st of every month at 06:30 UTC (13:30 BKK) — after the previous month is complete
    - cron: '30 6 1 * *'
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch weather data (Open-Meteo)
        run: python scripts/fetch_weather.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/weather-province.json
          message: "auto: update province weather data (Open-Meteo)"
          date-format: ""
