name: Update Dam Water Levels

on:
  schedule:
    # GitHub ปล่อย cron ช้าจริง 6–10 ชม. (พ.ย. 69) — รอบ 09/11 UTC เคยไปรันหลังเที่ยงคืนไทย
    # ตอน API ของ RID ขึ้นวันใหม่ที่ยังว่าง → ตัวกันไม่เขียนทับ → ข้อมูลค้าง 3 วัน (3–6 พ.ย.)
    # จึงตั้ง 3 รอบให้เร็วขึ้น: รอบไหนข้อมูลยังไม่มา/ไม่เปลี่ยน commit-data ข้ามให้เอง
    - cron: '0 3 * * *'   # 10:00 BKK
    - cron: '0 6 * * *'   # 13:00 BKK
    - cron: '0 9 * * *'   # 16:00 BKK
  workflow_dispatch:

jobs:
  update-dam:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch dam water levels (RID API)
        run: python scripts/fetch_dam_water.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/dam-water.json
          message: "auto: update dam water levels (RID)"
          date-format: ""
