name: Update GISTDA Flood Extent

on:
  schedule:
    # ทุก 6 ชม. นาที 35 — กันชนคิวช่วง :00 ที่ workflow อื่นชุมนุมกันเยอะ
    # ภาพดาวเทียมไม่ได้เปลี่ยนถี่กว่านี้ (สคริปต์บอกเองว่าฉากเดิมหรือฉากใหม่)
    - cron: '35 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gistda-flood:
    runs-on: ubuntu-latest
    name: Fetch GISTDA satellite flood extent & update gistda-flood.json

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🌊 Fetch GISTDA flood extent
        run: python scripts/fetch_gistda_flood.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/gistda-flood.json
          message: "auto: update GISTDA flood extent"
