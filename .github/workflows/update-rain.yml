name: Update Rain Data (Open-Meteo + GSMaP + Forecast)

on:
  schedule:
    # ทุกวัน เวลา 07:00 UTC (14:00 BKK) — รอให้ฝนช่วงเช้าตกก่อนแล้วค่อยดึง
    - cron: '0 7 * * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-rain:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests earthengine-api

      - name: Fetch 7-day rainfall data from Open-Meteo
        run: python scripts/fetch_rain_daily.py

      - name: Fetch 7-day rainfall data from JAXA GSMaP (GEE)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rain_gsmap.py

      - name: Fetch 7-day rain forecast from Open-Meteo
        run: python scripts/fetch_rain_forecast.py

      - name: Generate agricultural warnings
        run: python scripts/fetch_agri_warnings.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rain-daily.json data/rain-gsmap.json data/rain-forecast.json data/agri-warnings.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: update rain-daily $(date +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
