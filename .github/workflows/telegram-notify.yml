name: Telegram Alerts (subscribe + level-change notify)

on:
  schedule:
    # ทุก 15 นาที — เพื่อให้ยืนยันการสมัครผ่านปุ่ม /start เร็ว
    # การแจ้งเตือนจริงอิงข้อมูล agri-warnings.json ที่อัปเดตวันละครั้ง (update-rain.yml)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  telegram-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Poll Telegram + notify subscribers on level change
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_notify.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # ไฟล์ยังไม่ถูกสร้างถ้า TELEGRAM_BOT_TOKEN ยังไม่ตั้ง (สคริปต์ no-op ตั้งแต่ก่อนเขียนไฟล์)
          git add data/telegram-subscribers.json 2>/dev/null || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: telegram subscribers update $(date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
