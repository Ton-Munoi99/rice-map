name: Telegram Alerts (subscribe + level-change notify)

on:
  schedule:
    # ทุก 15 นาที — เพื่อให้ยืนยันการสมัครผ่านปุ่ม /start เร็ว
    # การแจ้งเตือนจริงอิงข้อมูล agri-warnings.json ที่อัปเดตวันละครั้ง (update-rain.yml)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  telegram-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Poll Telegram + notify subscribers on level change
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_notify.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/telegram-subscribers.json
          message: "auto: telegram subscribers update"
          date-format: "%Y-%m-%d %H:%M"
