name: 🏭 Auto-Update Thai Rice Millers Prices

on:
  schedule:
    # รอบแรก  08:00 Bangkok (01:00 UTC)
    # รอบสอง  11:00 Bangkok (04:00 UTC)
    # รอบสาม  15:00 Bangkok (08:00 UTC) — PDF มักออกช่วงบ่าย ต้องการรอบนี้มากที่สุด
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: # รันด้วยมือได้

permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    name: Fetch Miller PDF & Extract Prices

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests pdfplumber

      - name: 🔄 Fetch latest PDF and extract prices
        run: python scripts/fetch_miller_prices.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/prices-live.json
          message: "🤖 Auto-update: Thai Rice Millers prices"
