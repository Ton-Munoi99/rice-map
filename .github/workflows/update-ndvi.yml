name: Update Rice EVI (MODIS)

on:
  schedule:
    # วันที่ 8 ของทุกเดือน เวลา 03:00 UTC (10:00 BKK)
    # รอ 8 วันเพื่อให้ MODIS MOD13A3 ของเดือนที่แล้วพร้อมแน่นอน
    # วันที่ 20 ไม่ใช่วันที่ 8 — MOD13A3 ของเดือนก่อนยังไม่เข้า GEE ตอนวันที่ 8
    # (8 ส.ค. 2569 หาข้อมูล ก.ค. ไม่เจอ ต้อง fallback ไป มิ.ย. ทำให้เว็บแสดงข้อมูลเก่า 2 เดือน
    #  พอลองรันใหม่วันที่ 18 ได้ ก.ค. ทันที) · สคริปต์ยัง fallback ได้อยู่ถ้าต้นทางช้ากว่าปกติ
    - cron: '0 3 20 * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-ndvi:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Fetch Rice EVI data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rice_evi.py

      - name: Fetch Rice EVI district data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rice_evi_district.py

      - name: Validate Rice EVI vs OAE (monitor overcount/drift)
        # informational — ไม่ fail pipeline (ไม่ใส่ --strict) แค่รายงานใน log + เขียน json
        run: python scripts/validate_rice_evi.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/rice-evi.json data/rice-evi-district.json data/rice-evi-validation.json
          message: "auto: update Rice EVI (province+district)"
          date-format: "%Y-%m"
