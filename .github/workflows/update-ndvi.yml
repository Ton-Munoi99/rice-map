name: Update NDVI Data (MODIS)

on:
  schedule:
    # วันที่ 8 ของทุกเดือน เวลา 03:00 UTC (10:00 BKK)
    # รอ 8 วันเพื่อให้ MODIS MOD13A3 ของเดือนที่แล้วพร้อมแน่นอน
    - cron: '0 3 8 * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-ndvi:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Fetch NDVI data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_ndvi.py

      - name: Fetch Rice EVI data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rice_evi.py

      - name: Fetch NDVI district data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_ndvi_district.py

      - name: Fetch Rice EVI district data from GEE
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rice_evi_district.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ndvi.json data/rice-evi.json \
                  data/ndvi-district.json data/rice-evi-district.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "auto: update NDVI + Rice EVI (province+district) $(date +'%Y-%m')" && \
             git pull --rebase origin main && git push)
