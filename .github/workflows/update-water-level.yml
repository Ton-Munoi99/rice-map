name: Update Water Level Stations

on:
  schedule:
    # ทุก 3 ชั่วโมง (realtime — ThaiWater อัปเดตต่อเนื่อง)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-water-level:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch water-level stations (ThaiWater API)
        run: python scripts/fetch_water_level.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/water-level.json
          message: "auto: update water-level stations (ThaiWater)"
          date-format: ""
