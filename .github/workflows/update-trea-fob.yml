name: Update TREA FOB Prices

on:
  schedule:
    # TREA อัปเดตทุกวันพุธ (บางครั้งพฤหัส) เวลาไม่แน่นอน — รัน จ-ศ 3 รอบเพื่อไม่พลาด
    # รอบ 13:00 BKK (06:00 UTC), 15:30 BKK (08:30 UTC), 17:00 BKK (10:00 UTC)
    # NOTE: เลื่อนรอบ 2 จาก 08:00 → 08:30 UTC เพื่อหลีกเลี่ยงชน Miller (08:00 UTC)
    - cron: '0 6 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Fetch FOB Prices from TREA
        run: python scripts/fetch_trea_fob.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/trea-fob.json
          message: "auto: update TREA FOB rice prices"
          date-format: ""
