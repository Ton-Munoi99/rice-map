name: Update TREA FOB Prices

on:
  schedule:
    # TREA อัปเดตทุกวันพุธ (บางครั้งพฤหัส) เวลาไม่แน่นอน — รัน จ-ศ 3 รอบเพื่อไม่พลาด
    # รอบ 13:00 BKK (06:00 UTC), 15:30 BKK (08:30 UTC), 17:00 BKK (10:00 UTC)
    # NOTE: เลื่อนรอบ 2 จาก 08:00 → 08:30 UTC เพื่อหลีกเลี่ยงชน Miller (08:00 UTC)
    - cron: '0 6 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Fetch FOB Prices from TREA
        run: python scripts/fetch_trea_fob.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trea-fob.json

          # Only commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes — prices already up to date."
          else
            git commit -m "auto: update TREA FOB rice prices"
            # Retry push up to 3 times (handles concurrent workflow conflicts)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
