name: Update Storm Alerts

on:
  schedule:
    - cron: '0 */6 * * *'  # ทุก 6 ชั่วโมง
  workflow_dispatch:

jobs:
  update-storm-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch storm alerts
        run: python scripts/fetch_storm_alerts.py
      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/storm-alerts.json
          message: "auto: update storm alerts"
          date-format: "%Y-%m-%d %H:%M"
