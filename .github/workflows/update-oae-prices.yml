name: 🌾 Auto-Update OAE National Rice Prices

on:
  schedule:
    # ทุกวัน 07:00 น. เวลาไทย (UTC+7 = 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # รันด้วยมือได้ผ่าน GitHub UI

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    name: Fetch OAE weekly farm-gate prices & update prices-live.json

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Fetch OAE prices
        # Cloudflare หน้า API ตอบ 403 ให้ IP ของ runner — สคริปต์จะสลับไปใช้
        # Firecrawl (เบราว์เซอร์จริง) เองเมื่อเจอ 403
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/fetch_oae_prices.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/prices-live.json
          message: "🤖 Auto-update: OAE national prices"
