name: Update Disease Risk Data (Open-Meteo)

on:
  schedule:
    # ทุกวัน เวลา 07:30 UTC (14:30 BKK) — รันหลัง update-rain เล็กน้อย
    - cron: '30 7 * * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-disease-risk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 7-day disease risk indicators from Open-Meteo
        run: python scripts/fetch_disease_risk.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/disease-risk.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: update disease risk indicators $(date +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
