name: Update Disease Risk Data (Open-Meteo)

on:
  schedule:
    # ทุกวัน เวลา 07:30 UTC (14:30 BKK) — รันหลัง update-rain เล็กน้อย
    - cron: '30 7 * * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-disease-risk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 7-day disease risk indicators from Open-Meteo
        run: python scripts/fetch_disease_risk.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/disease-risk.json
          message: "auto: update disease risk indicators"
