name: Update Rice News (Google News RSS)

on:
  schedule:
    # ทุก 8 ชั่วโมง (03:00, 11:00, 19:00 UTC = 10:00, 18:00, 02:00 BKK)
    - cron: '0 3,11,19 * * *'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-rice-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # ใช้ urllib จาก stdlib เท่านั้น — ไม่ต้อง pip install

      - name: Fetch Thai rice news from Google News RSS
        run: python scripts/fetch_rice_news.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/rice-news.json data/rice-news-archive.json
          message: "auto: update rice news"
          date-format: "%Y-%m-%d %H:%M"
