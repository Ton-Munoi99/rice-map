name: Update TMD Hourly Rain Forecast (48h)

on:
  schedule:
    # ทุก 6 ชั่วโมง — ตาม cycle ทั่วไปของโมเดล NWP (4 รอบ/วัน) ไม่มีประโยชน์รันถี่กว่านี้
    # เพราะ TMD ไม่ได้อัปเดตโมเดลทุกชั่วโมง มีแค่ resolution การพยากรณ์เป็นรายชั่วโมง
    - cron: '15 */6 * * *'  # นาที 15 กันชนคิวช่วง :00 ที่ workflow อื่นชุมนุมกันเยอะ
  workflow_dispatch:  # ทดสอบ token บน runner จริงแล้ว (77/77 จังหวัด) เปิด cron ได้

permissions:
  contents: write

jobs:
  update-tmd-forecast:
    runs-on: ubuntu-latest
    name: Fetch TMD hourly rain forecast (2km, 48h) & update tmd-forecast.json

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🌧️ Fetch TMD forecast
        env:
          TMD_API_TOKEN: ${{ secrets.TMD_API_TOKEN }}
        run: python scripts/fetch_tmd_forecast.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/tmd-forecast.json
          message: "auto: update TMD hourly rain forecast (48h)"
