name: Rice EVI Sentinel-2 PoC (manual)

# PoC เท่านั้น — รันมือ (workflow_dispatch) ไม่มี schedule
# พิสูจน์ว่า Sentinel-2 10m รันได้จริงในโควตา/เวลาของ Actions ก่อนขยายทั้งประเทศ
on:
  workflow_dispatch:

jobs:
  s2-poc:
    runs-on: ubuntu-latest
    # S2 10m หนักกว่า MODIS มาก — เผื่อเวลาไว้เยอะ
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Fetch Rice EVI (Sentinel-2 PoC)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_rice_evi_s2_poc.py

      - name: Commit PoC output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rice-evi-s2-poc.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "poc: rice EVI Sentinel-2 (test provinces) $(date +'%Y-%m')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
