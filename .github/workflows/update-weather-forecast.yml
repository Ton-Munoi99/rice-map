name: Update Seasonal Weather Forecast

on:
  schedule:
    # 1st of every month at 07:30 UTC (14:30 BKK) — refresh ECMWF ensemble
    - cron: '30 7 1 * *'
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch seasonal forecast (Open-Meteo ECMWF)
        run: python scripts/fetch_weather_forecast.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/weather-forecast.json
          message: "auto: update seasonal weather forecast (ECMWF IFS)"
          date-format: ""
