name: Update Soil Moisture Data (NASA SMAP)

on:
  schedule:
    # ทุกวันจันทร์ 05:00 UTC (12:00 BKK) — SMAP lag ~2-3 วัน จึงดึงข้อมูลรายสัปดาห์
    - cron: '0 5 * * 1'
  workflow_dispatch:  # กด trigger manual ได้

jobs:
  update-soil-moisture:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Fetch Soil Moisture from NASA SMAP (GEE)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_soil_moisture.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/soil-moisture.json
          message: "auto: update soil moisture (NASA SMAP)"
