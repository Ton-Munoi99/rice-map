name: Update Fertilizer Prices (weekly, real retail)

on:
  schedule:
    # ทุกวันจันทร์ 11:00 UTC = 18:00 น. (เย็นวันจันทร์) เวลาไทย
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  update-fertilizer-prices:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh real fertilizer prices (Firecrawl)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/fetch_fertilizer_prices.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/fertilizer-prices.json
          message: "auto: update fertilizer prices"
